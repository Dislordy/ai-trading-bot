name: Daily AI trade

on:
  schedule:
    # Every weekday at 14:00 UTC = 9:00 AM Central (daylight time).
    # GitHub only understands UTC, so in winter (CST) this runs at 8:00 AM Central instead.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:          # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write             # lets the bot save its trade log back to your repo

# Never run two trades at the same time
concurrency:
  group: daily-ai-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # always start from the newest logs, even on a re-run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the AI
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # lets Claude make the daily decision
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "No Alpaca keys set up yet. Add them under Settings > Secrets and variables > Actions."
            exit 0
          fi
          # bot.py skips (without failing) on weekends and market holidays
          python bot.py trade
          python bot.py status

      - name: Save trade log
        run: |
          LOGS="trade_log.csv claude_log.csv"
          mkdir -p "$RUNNER_TEMP/new"
          for f in $LOGS; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/new/$f"; done
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          # Add only this run's new rows on top of the newest logs on GitHub, so two runs never clash.
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            for f in $LOGS; do
              [ -f "$RUNNER_TEMP/new/$f" ] || continue
              if [ -f "$f" ]; then
                grep -vxF -f "$f" "$RUNNER_TEMP/new/$f" >> "$f" || true
              else
                cp "$RUNNER_TEMP/new/$f" "$f"
              fi
              git add "$f"
            done
            if git diff --cached --quiet; then
              echo "Nothing new to save (market closed?)."
              exit 0
            fi
            git commit -q -m "Trade log $(date +%F)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Logs saved. The website will show them within a few minutes."
              exit 0
            fi
            echo "Someone else saved at the same moment, trying again..."
            sleep 5
          done
          echo "Could not save the logs after 3 tries."
          exit 1
