name: Daily AI trade

on:
  schedule:
    # Every weekday at 14:00 UTC = 9:00 AM Central (daylight time).
    # GitHub only understands UTC, so in winter (CST) this runs at 8:00 AM Central instead.
    - cron: "56 14 * * 1-5"
  workflow_dispatch:          # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write             # lets the bot save its trade log back to your repo

# Never run two trades at the same time
concurrency:
  group: daily-ai-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the AI
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "No Alpaca keys set up yet. Add them under Settings > Secrets and variables > Actions."
            exit 0
          fi
          # bot.py skips (without failing) on weekends and market holidays
          python bot.py trade
          python bot.py status

      - name: Save trade log
        run: |
          if [ ! -f trade_log.csv ]; then
            echo "No trade log yet, nothing to save."
            exit 0
          fi
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add trade_log.csv
          if git diff --cached --quiet; then
            echo "No new trades today (market closed?), nothing to commit."
            exit 0
          fi
          git commit -m "Trade log $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # in case you pushed something meanwhile
          git push origin "HEAD:${GITHUB_REF_NAME}"   # the website reads this file, so it updates right away

